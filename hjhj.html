<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A lantern for you</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Figtree:wght@400;600&display=swap">
<style>
:root{
  --sky1:#0e0c2e; --sky2:#34205c; --glow:#ffb633; --rose:#ff7a9c;
  --ink:#fff4df; --muted:#cfc4e6; --hill:#0a0920; --figure:#04030f;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:inherit}
body{margin:0;height:100%;overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation;color:var(--ink);font-family:"Figtree",system-ui,sans-serif;
  background:linear-gradient(var(--sky1) 0%,var(--sky2) 70%,#6b2f5e 100%)}
#stage{position:relative;height:100%;width:100%;overflow:hidden}
#stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.1}}
.h{position:absolute;pointer-events:none;color:var(--rose);opacity:.85;text-shadow:0 0 10px rgba(255,122,156,.8);animation:hf 4s ease-out forwards}
@keyframes hf{to{transform:translate(var(--dx),var(--dy)) scale(.5);opacity:0}}
.l{position:absolute;width:var(--s);height:calc(var(--s)*1.3);
  border-radius:38% 38% 22% 22%/30% 30% 20% 20%;
  background:linear-gradient(#ffe29a,#ff9a3c 70%,#ff7a5c);
  box-shadow:0 0 calc(var(--s)*.9) rgba(255,170,60,.65)}
.l::after{content:"";position:absolute;left:30%;right:30%;bottom:-14%;height:14%;
  background:#ffb633;opacity:.8;border-radius:0 0 50% 50%;filter:blur(2px)}
.bg .l{bottom:-12%;left:var(--x);opacity:var(--o);filter:blur(var(--b));
  animation:rise var(--d) linear var(--dl) infinite}
@keyframes rise{to{transform:translate(var(--dx),-125vh)}}
#hill{position:absolute;left:-20%;width:140%;height:30dvh;bottom:-12dvh;border-radius:50% 50% 0 0;background:var(--hill)}
#pair{position:absolute;left:50%;bottom:17dvh;transform:translateX(-50%);width:clamp(130px,34vw,200px)}
#pair::before{content:"";position:absolute;left:50%;top:32%;width:190%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,140,130,.38),transparent 60%);animation:pulse 4s ease-in-out infinite}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.15);opacity:.7}}
#pair svg{display:block;width:100%;height:auto}
#mine{--s:clamp(30px,8vw,44px);left:50%;top:60%;transform:translate(-50%,-70%);
  transition:transform 8s cubic-bezier(.35,.1,.25,1),opacity 3s 6s}
#mine.go{transform:translate(-50%,-80dvh) scale(1.5);opacity:0}
#go{position:absolute;left:50%;bottom:calc(17dvh + clamp(130px,34vw,200px)*.85);transform:translateX(-50%);
  font:inherit;font-weight:600;color:var(--sky1);background:var(--glow);border:0;
  padding:15px 28px;font-size:1.05rem;border-radius:999px;cursor:pointer;white-space:nowrap;transition:opacity .6s}
#go:focus-visible,#mute:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
#go.off{opacity:0;pointer-events:none}
#content{position:absolute;inset:0;bottom:31dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3.5dvh,32px);padding:56px 22px 0}
#wish{max-width:680px;text-align:center}
h1{font-family:"Dancing Script","Brush Script MT",cursive;font-weight:700;font-size:clamp(2.3rem,10.5vw,4rem);line-height:1.15;margin:0;text-shadow:0 0 24px rgba(255,150,170,.55)}
h1 span{opacity:0;display:inline-block;margin-right:.28em;filter:blur(6px);transform:translateY(8px)}
.on h1 span{animation:word 1.1s forwards;animation-delay:calc(var(--i)*.22s)}
@keyframes word{to{opacity:1;filter:none;transform:none}}
#for{margin:14px 0 0;color:var(--muted);opacity:0;transition:opacity 1.5s 2.8s}
.on #for{opacity:1}
#photo{position:relative;margin:0;flex:none;width:min(60vw,28dvh,270px);rotate:-3deg;animation:fl 5s ease-in-out infinite;
  background:#fff8ec;padding:10px 10px 44px;border-radius:3px;box-shadow:0 10px 40px rgba(0,0,0,.5);
  opacity:0;transition:opacity 1.2s}
#photo.show{opacity:1}
#pic{aspect-ratio:1;width:100%;display:grid;place-items:center;font-size:2.4rem;color:#fff;
  background:linear-gradient(135deg,#ff7a9c,#9d7bff);background-size:cover;background-position:center;
  transition:opacity .6s}
#cap{position:absolute;left:0;right:0;bottom:6px;text-align:center;color:#4a3550;font-family:"Dancing Script",cursive;font-size:1.1rem;line-height:1.05;font-weight:600;padding:0 6px;transition:opacity .6s}
@keyframes fl{50%{translate:0 -6px;rotate:-1deg}}
#note{position:absolute;inset:0;z-index:5;overflow:hidden;display:grid;place-items:center;padding:22px;background:rgba(10,8,30,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .8s,visibility 0s .8s}
#note.show{opacity:1;visibility:visible;transition-delay:0s}
::-webkit-scrollbar{display:none}
#note .card{position:relative;z-index:1;width:100%;max-width:440px;max-height:calc(100dvh - 40px);overflow:hidden;text-align:center;padding:clamp(18px,4dvh,32px) 22px clamp(16px,3dvh,24px);border-radius:26px;background:linear-gradient(160deg,rgba(60,24,80,.8),rgba(120,36,92,.74));border:1px solid rgba(255,190,210,.45);color:var(--ink);box-shadow:0 0 0 1px rgba(255,255,255,.06) inset,0 20px 70px rgba(0,0,0,.55),0 0 90px rgba(255,110,150,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transform:scale(.4) rotate(-4deg);opacity:0}
@keyframes glowb{50%{box-shadow:0 0 0 1px rgba(255,255,255,.06) inset,0 20px 70px rgba(0,0,0,.55),0 0 130px rgba(255,110,150,.75)}}
@keyframes fade{to{opacity:1}}
.p{position:absolute;top:-30px;z-index:0;pointer-events:none;color:#ff8fb0;opacity:.9;text-shadow:0 0 8px rgba(255,120,160,.7);animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),calc(100dvh + 60px)) rotate(var(--r))}}
#note.show .card{animation:pop 1s cubic-bezier(.2,1.4,.3,1) forwards,glowb 3.5s ease-in-out 1s infinite}
@keyframes pop{to{transform:none;opacity:1}}
.seal{font-size:clamp(2.2rem,8dvh,3.2rem);line-height:1;color:#ff5c8a;text-shadow:0 0 22px rgba(255,92,138,.9);animation:beat 1.3s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.2)}}
#notetxt{font-family:"Dancing Script","Brush Script MT",cursive;font-weight:600;font-size:clamp(1.3rem,min(6.2vw,3.4dvh),1.9rem);line-height:1.35;margin:10px 0 10px;text-shadow:0 0 16px rgba(255,150,180,.45)}
#notetxt span{display:inline-block;margin-right:.26em;opacity:0;filter:blur(6px);transform:translateY(10px)}
.show #notetxt span{animation:word 1s forwards;animation-delay:calc(1s + var(--i)*.2s)}
.show .sig{animation:fade 1.2s forwards;animation-delay:calc(1.4s + var(--n)*.2s)}
.show #close{animation:fade 1s forwards;animation-delay:calc(2.8s + var(--n)*.2s)}
.sig{margin:0 0 16px;color:#ffb3c7;font-family:"Dancing Script",cursive;font-size:1.6rem;font-weight:700;opacity:0}
#close{font:inherit;font-weight:600;color:#fff;background:#e0446a;border:0;padding:13px 28px;border-radius:999px;cursor:pointer;opacity:0}
#close:focus-visible,#reopen:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
#reopen{position:absolute;left:14px;top:12px;z-index:2;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(10,9,32,.5);color:var(--ink);font-size:1.1rem;cursor:pointer;display:none}
@media (max-height:700px){h1{font-size:clamp(1.9rem,8.5vw,3rem)}#content{bottom:30dvh;padding-top:50px}}
.swap #pic,.swap #cap{opacity:0}
#mute{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:2;width:44px;height:44px;
  border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(10,9,32,.5);color:var(--ink);
  font-size:1.1rem;cursor:pointer;display:none}
@media (prefers-reduced-motion:reduce){
  .bg .l{animation:none;bottom:auto;top:var(--t)}
  #mine{transition-duration:.01s;transition-delay:0s}
  .h{display:none}#photo,#stars i,#pair::before{animation:none}
}
</style>
</head>
<body>
<main id="stage">
  <div id="stars" aria-hidden="true"></div>
  <div class="bg" id="bg" aria-hidden="true"></div>
  <div id="content"><section id="wish" aria-live="polite">
    <h1 id="title"></h1>
    <p id="for"></p>
  </section>
  <figure id="photo" style="margin-left:0">
    <div id="pic" aria-hidden="true">♥</div>
    <figcaption id="cap"></figcaption>
  </figure></div>
  <div id="hill" aria-hidden="true"></div>
  <div id="pair">
    <svg viewBox="0 0 200 160" aria-label="Two people holding a lantern" role="img" fill="#04030f" stroke="#04030f">
      <circle cx="78" cy="40" r="13" stroke="none"/>
      <path d="M60 160 L64 72 Q78 58 92 72 L96 160 Z" stroke="none"/>
      <circle cx="124" cy="38" r="13" stroke="none"/>
      <path d="M92 160 L108 72 Q124 58 140 72 L156 160 Z" stroke="none"/>
      <path d="M88 84 Q96 98 100 92 M112 84 Q104 98 100 92" fill="none" stroke-width="6" stroke-linecap="round"/>
    </svg>
    <div class="l" id="mine"></div>
  </div>
  <div id="note" role="dialog" aria-modal="true" aria-labelledby="notetxt">
    <div class="card">
      <div class="seal" aria-hidden="true">♥</div>
      <p id="notetxt">My day doesn’t really start until your name pops up on my screen, and it doesn’t end until I say goodnight. You are my favorite hello and my hardest goodbye.</p>
      <p class="sig">Happy birthday, my Matti ♥</p>
      <button id="close">Close</button>
    </div>
  </div>
  <button id="reopen" aria-label="Read the message again">✉</button>
  <button id="go">Send our lantern</button>
  <button id="mute" aria-label="Mute music" aria-pressed="false">♪</button>
</main>

/* Music: music-box style melody made with Web Audio (no audio files needed) */
var ac, master, muted = false, B = 0.6;
var TUNE = [[392,.75],[392,.25],[440,1],[392,1],[523.25,1],[493.88,2],
  [392,.75],[392,.25],[440,1],[392,1],[587.33,1],[523.25,2],
  [392,.75],[392,.25],[783.99,1],[659.25,1],[523.25,1],[493.88,1],[440,2],
  [698.46,.75],[698.46,.25],[659.25,1],[523.25,1],[587.33,1],[523.25,2]];
function note(f, t, dur) {
  var o = ac.createOscillator(), g = ac.createGain(), len = Math.max(dur * 1.6, .8);
  o.type = "triangle"; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.35, t + .015);
  g.gain.exponentialRampToValueAtTime(.001, t + len);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + len + .1);
}
function loop() {
  var t = ac.currentTime + .1;
  TUNE.forEach(function (n) { note(n[0], t, n[1] * B); t += n[1] * B; });
  setTimeout(loop, (t - ac.currentTime + 3) * 1000);
}
function startMusic() {
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    ac = new AC(); if (ac.resume) ac.resume(); master = ac.createGain(); master.gain.value = .5;
    var dl = ac.createDelay(); dl.delayTime.value = .32;
    var fb = ac.createGain(); fb.gain.value = .35;
    dl.connect(fb); fb.connect(dl); master.connect(dl); dl.connect(ac.destination); master.connect(ac.destination);
    loop(); $("mute").style.display = "block";
  } catch (e) {}
}
var NOTE = $("notetxt").textContent.trim().split(/\s+/);
$("notetxt").innerHTML = NOTE.map(function (w, i) { return '<span style="--i:' + i + '">' + w + "</span>"; }).join(" ");
$("note").style.setProperty("--n", NOTE.length);
var petalTimer;
function petal() {
  var p = document.createElement("div");
  p.className = "p"; p.textContent = Math.random() < .5 ? "\u2665" : "\u2740";
  p.style.cssText = "left:" + rnd(0, 100) + "%;font-size:" + rnd(12, 26) + "px;--dx:" + rnd(-60, 60) + "px;--r:" + rnd(-300, 300) + "deg;animation-duration:" + rnd(5, 9) + "s";
  $("note").appendChild(p);
  setTimeout(function () { p.remove(); }, 9500);
}
function openNote() {
  $("note").classList.add("show"); clearInterval(petalTimer);
  petalTimer = setInterval(petal, 380);
  for (var i = 0; i < 16; i++) setTimeout(petal, i * 90);
}
$("close").addEventListener("click", function () {
  $("note").classList.remove("show"); clearInterval(petalTimer); $("reopen").style.display = "block";
});
$("reopen").addEventListener("click", openNote);
$("mute").addEventListener("click", function () {
  muted = !muted; master.gain.value = muted ? 0 : .5;
  this.setAttribute("aria-pressed", muted); this.style.opacity = muted ? .5 : 1;
  this.setAttribute("aria-label", muted ? "Unmute music" : "Mute music");
});

/* Photo memories */
var k = 0;
function showMemory() {
  var m = MEMORIES[k % MEMORIES.length], ph = $("photo");
  ph.classList.add("swap");
  setTimeout(function () {
    $("pic").style.backgroundImage = m.src ? 'url("' + m.src + '")' : "none";
    $("pic").textContent = m.src ? "" : "♥";
    $("cap").textContent = m.cap;
    ph.classList.remove("swap"); k++;
  }, 600);
}

function heart(x, y, a, b) {
  var h = document.createElement("div");
  h.className = "h"; h.textContent = "♥";
  h.style.cssText = "left:" + x + "px;top:" + y + "px;font-size:" + rnd(a, b) + "px;--dx:" + rnd(-30, 30) + "px;--dy:-" + rnd(120, innerHeight * .6) + "px";
  $("stage").appendChild(h);
  setTimeout(function () { h.remove(); }, 4500);
}
$("go").addEventListener("click", function () {
  this.classList.add("off");
  startMusic();
  $("mine").classList.add("go");
  var tr = setInterval(function () { var r = $("mine").getBoundingClientRect(); heart(r.left + r.width / 2, r.bottom, 10, 16); }, 350);
  setTimeout(function () { clearInterval(tr); }, 7500);
  setTimeout(function () { $("wish").classList.add("on"); for (var q = 0; q < 14; q++) setTimeout(function () { heart(rnd(0, innerWidth), innerHeight * rnd(.5, 1), 12, 24); }, q * 120); }, 3500);
  setTimeout(function () {
    showMemory(); $("photo").classList.add("show");
    setInterval(function () { heart(rnd(5, innerWidth - 5), innerHeight, 10, 22); }, 700);
    var sl = setInterval(function () {
      if (k >= MEMORIES.length) {
        clearInterval(sl);
        $("photo").classList.remove("show");
        setTimeout(openNote, 1400);
        return;
      }
      showMemory();
    }, 4500);
  }, 8500);
});
</script>
</body>
